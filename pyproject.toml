[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "optimal-transport"
version = "0.0.1"
authors = [
  { name = "Ryuto Yoshida" },
]
description = "Typed POT-backed optimal transport solvers with a common problem and plan API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0",
    "pot>=0.9.5",
]

[project.urls]
Homepage = "https://github.com/ry-yoshida-dev/OptimalTransport"
"Bug Tracker" = "https://github.com/ry-yoshida-dev/OptimalTransport/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
stubPath = "stubs"
exclude = ["stubs", ".venv"]

[tool.mypy]
mypy_path = "stubs:src"
files = ["src", "tests"]
explicit_package_bases = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]

[dependency-groups]
dev = [
    "basedpyright>=1.40.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
target-version = "py312"
extend-exclude = ["stubs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.uv]
exclude-newer = "7 days"
